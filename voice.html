<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Assistant</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: clamp(20px, 5vw, 50px) 16px;
      margin: 0;
      background-color: #F1F3F5;
      color: #18181B;
    }
    img {
      max-width: 100%;
      height: auto;
    }
    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: clamp(20px, 4vw, 40px);
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border: 1px solid #E5E7EB;
    }
    button {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 12px;
      background: #18181B;
      color: #FFFFFF;
      border: none;
      font-weight: 600;
      width: 100%;
      max-width: 320px;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #27272A;
    }
    #output, #ai-response {
      margin-top: 20px;
      font-size: 18px;
      word-break: break-word;
    }
    #ai-response {
      color: #18181B;
      font-weight: 600;
    }

    /* Media Queries */
    @media screen and (max-width: 600px) {
      body {
        padding: 20px 12px;
      }
      .container {
        width: 100%;
        padding: 20px 16px;
      }
      button {
        width: 100%;
        padding: 14px 20px;
        font-size: 16px;
      }
    }

    @media screen and (max-width: 992px) {
      .container {
        width: 100%;
        max-width: 600px;
      }
    }

    @media screen and (min-width: 993px) {
      .container {
        width: 100%;
        max-width: 600px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Voice Assistant</h1>
    <button id="start-btn">Start Listening</button>
    <p id="output">Click to speak to the AI...</p>
    <p id="ai-response"></p>
  </div>

  <script>
    // Paste your API key here for local testing ONLY
    const GEMINI_API_KEY = 'YOUR_API_KEY_HERE'; 

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    const synth = window.speechSynthesis;

    // 1. Listen to the user
    recognition.onresult = async (event) => {
      const userQuestion = event.results[0][0].transcript;
      document.getElementById('output').innerText = "You asked: " + userQuestion;
      document.getElementById('ai-response').innerText = "Thinking...";

      // 2. Send the question to the AI
      const aiAnswer = await askAI(userQuestion);
      
      // 3. Display and speak the answer
      document.getElementById('ai-response').innerText = "AI says: " + aiAnswer;
      speak(aiAnswer);
    };

    // Function to communicate with the Gemini API via fetch
    async function askAI(promptText) {
      // The endpoint for the Gemini API
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent?key=${GEMINI_API_KEY}`;
      
      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{
                // Add instructions to keep responses short so the voice doesn't talk forever!
                text: "You are a helpful voice assistant. Keep your answer brief, conversational, and under 2 sentences. The user says: " + promptText
              }]
            }]
          })
        });

        const data = await response.json();
        
        // Extract the text from the AI's complex JSON response
        if (data.candidates && data.candidates[0].content) {
             return data.candidates[0].content.parts[0].text;
        } else {
             return "I couldn't generate a response.";
        }
      } catch (error) {
        console.error("API Error:", error);
        return "Sorry, I had trouble connecting to the brain.";
      }
    }

    // Function to speak the text
    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      // Optional: Change the voice or speed
      // utterance.rate = 1.1; 
      synth.speak(utterance);
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      document.getElementById('output').innerText = "Listening...";
      document.getElementById('ai-response').innerText = "";
      recognition.start();
    });
  </script>

</body>
</html>
